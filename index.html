<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duarte Sánchez Vázquez — Sales Candidate Assessment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   OMG report look — palette, type, and components
   ============================================================ */
:root{
  --c-will:#A2C0D6;
  --c-dna:#E68E70;
  --c-tactical:#839786;
  --c-other:#C0C4C7;

  --fill-under:#9D9FA1;
  --navy:#1F2537;
  --navy-rule:#3C4457;

  --page:#FFFFFF;
  --shell:#F5F6F7;
  --ink:#202124;
  --ink-soft:#5F6368;
  --ink-faint:#9AA0A6;
  --rule:#DADCE0;
  --rule-soft:#EAECEE;
  --hover:#F1F3F4;

  --bar-h:36px;
  --bar-min:34px;
}
:root[data-theme="dark"]{
  --c-will:#8FB3CD;
  --c-dna:#E68E70;
  --c-tactical:#8CA491;
  --c-other:#6C737A;

  --fill-under:#6E7378;
  --navy:#161B26;
  --navy-rule:#333B4C;

  --page:#181B21;
  --shell:#12151A;
  --ink:#E8EAED;
  --ink-soft:#A5ABB3;
  --ink-faint:#787F88;
  --rule:#333941;
  --rule-soft:#262B32;
  --hover:#20242B;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Roboto",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  background:var(--shell); color:var(--ink);
  font-size:15px; -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;color:inherit;}

/* ---------- Shell ---------- */
.app{display:flex;min-height:100vh;}

.sidebar{
  width:274px;flex-shrink:0;background:var(--page);border-right:1px solid var(--rule);
  position:fixed;top:0;left:0;bottom:0;z-index:40;overflow-y:auto;
  display:flex;flex-direction:column;transition:transform .2s ease;
}
.sidebar.closed{transform:translateX(-274px);}
.sb-head{padding:26px 22px 20px;border-bottom:1px solid var(--rule);}
.sb-name{font-size:13px;color:var(--ink-faint);letter-spacing:.01em;}
.sb-doc{font-size:19px;font-weight:400;margin-top:3px;line-height:1.25;}
.sb-role{font-size:11.5px;color:var(--ink-faint);margin-top:8px;letter-spacing:.06em;text-transform:uppercase;}

.sb-nav{padding:14px 12px 20px;flex:1;}
.sb-group-label{font-size:10.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);padding:16px 10px 6px;}
.sb-item{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:4px;
  font-size:14px;cursor:pointer;color:var(--ink);line-height:1.3;
}
.sb-item:hover{background:var(--hover);}
.sb-item.active{background:var(--hover);font-weight:500;}
.sb-item .dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--ink-faint));flex-shrink:0;}
.sb-item.active .dot{box-shadow:0 0 0 3px color-mix(in srgb, var(--c,var(--ink-faint)) 30%, transparent);}
.sb-sub{padding:2px 0 6px 30px;display:none;}
.sb-sub.open{display:block;}
.sb-subitem{
  display:block;padding:6px 10px;border-radius:4px;font-size:13px;color:var(--ink-soft);cursor:pointer;line-height:1.35;
}
.sb-subitem:hover{background:var(--hover);}
.sb-subitem.active{color:var(--ink);font-weight:500;background:var(--hover);}

.sb-foot{padding:18px 20px 22px;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:16px;}
.sb-foot-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.sb-foot-label{font-size:10.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);}

.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden;}
.seg button{border:none;background:transparent;padding:6px 14px;font-size:12.5px;color:var(--ink-soft);cursor:pointer;}
.seg button.on{background:var(--ink);color:var(--page);}

.seg.lang{display:flex;width:100%;padding:3px;border-radius:999px;overflow:visible;background:var(--hover);}
.seg.lang button{
  flex:1;padding:11px 8px;font-size:14px;line-height:1.2;border-radius:999px;
  color:var(--ink-soft);transition:background .12s,color .12s;
}
.seg.lang button:hover{color:var(--ink);}
.seg.lang button.on{background:var(--ink);color:var(--page);font-weight:500;}

/* topbar copy — only where the sidebar is off-canvas */
.topbar-spacer{flex:1;}
#topLang{display:none;}
.seg.lang.compact{width:auto;}
.seg.lang.compact button{padding:7px 14px;font-size:13px;}
.icon-btn{
  width:34px;height:34px;border-radius:50%;border:1px solid var(--rule);background:transparent;
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft);
}
.icon-btn svg{width:17px;height:17px;}

.main{flex:1;min-width:0;margin-left:274px;background:var(--page);transition:margin-left .2s ease;}
.main.wide{margin-left:0;}

.topbar{
  position:sticky;top:0;z-index:30;background:var(--page);border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:14px;padding:11px 32px;
}
.crumb{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);}
.crumb b{font-weight:500;color:var(--ink-soft);}
.burger{width:34px;height:34px;border:1px solid var(--rule);border-radius:4px;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.burger span{display:block;width:15px;height:1.5px;background:var(--ink-soft);position:relative;}
.burger span::before,.burger span::after{content:"";position:absolute;left:0;width:15px;height:1.5px;background:var(--ink-soft);}
.burger span::before{top:-5px;} .burger span::after{top:5px;}

.sheet{padding:52px 56px 96px;max-width:1108px;}
.sheet.flush{padding-top:0;}

/* ---------- Page head ---------- */
.phead{display:flex;align-items:flex-start;gap:48px;margin-bottom:38px;}
.phead-l{flex:0 0 auto;}
.ptitle{font-size:42px;font-weight:300;line-height:1.1;letter-spacing:-.005em;margin:0;color:var(--ink);}
.pintro{flex:1;font-size:15px;line-height:1.55;color:var(--ink);max-width:560px;padding-top:6px;}
.pscore{margin-left:auto;text-align:right;flex-shrink:0;padding-left:24px;}
.pscore .n{font-size:40px;font-weight:300;line-height:1;color:var(--sc,var(--ink-faint));}
.pscore .t{font-size:10px;color:var(--ink-faint);margin-top:5px;}

.phead.stacked{display:block;margin-bottom:34px;}
.phead.stacked .row{display:flex;align-items:flex-start;gap:32px;}
.phead.stacked .pscore{margin-left:auto;}
.phead.stacked .pintro{max-width:900px;padding-top:0;margin-top:20px;}

/* ---------- Bar ---------- */
.bar{position:relative;margin-bottom:8px;padding-bottom:22px;}
.bar-label{font-size:13.5px;margin-bottom:6px;color:var(--ink);line-height:1.3;}
.bar-label.drill{display:flex;align-items:center;justify-content:flex-start;gap:4px;}
.bar-label .chev{width:13px;height:13px;color:var(--c,var(--ink-faint));opacity:.85;flex-shrink:0;
  transition:transform .12s;}
.bar.grey .bar-label .chev{color:var(--ink-faint);opacity:.7;}

.bar-link{
  cursor:pointer;border-radius:10px;
  /* negative top margin cancels the padding so linked and unlinked bars
     keep identical vertical rhythm across the three columns */
  margin:-9px -12px 4px;padding:9px 12px 4px;
  transition:background .12s, box-shadow .12s;
}
.bar-link .bar{margin-bottom:0;}
.bar-link:hover{background:color-mix(in srgb, var(--c, var(--ink-faint)) 20%, transparent);}
.bar-link:hover .bar-track{border-color:var(--c, var(--ink-faint));}
.bar-link:hover .bar-label{text-decoration:underline;text-underline-offset:3px;}
.bar-link:hover .chev{transform:translateX(3px);}
.bar-link:focus-visible{outline:none;background:color-mix(in srgb, var(--c, var(--ink-faint)) 20%, transparent);
  box-shadow:0 0 0 2px var(--c, var(--ink-faint));}
.bar-link.grey{--c:var(--ink-faint);}
.bar-track{
  position:relative;height:var(--bar-h);border:1px solid var(--c,var(--rule));
  border-radius:999px;background:transparent;
}
.bar-fill{
  position:absolute;top:-1px;left:-1px;height:var(--bar-h);border-radius:999px;
  display:flex;align-items:center;justify-content:flex-end;
  background:var(--fill-under);
}
.bar-fill.at{
  background:linear-gradient(90deg, color-mix(in srgb, var(--c) 55%, #fff) 0%, var(--c) 100%);
}
:root[data-theme="dark"] .bar-fill.at{
  background:linear-gradient(90deg, color-mix(in srgb, var(--c) 45%, #2A3038) 0%, var(--c) 100%);
}
.bar-fill span{font-size:14px;color:#fff;padding-right:13px;letter-spacing:.01em;}
.bar-tick{
  position:absolute;top:calc(100% + 1px);height:20px;line-height:20px;
  border-left:1px solid var(--fill-under);padding-left:7px;
  font-size:10px;color:var(--ink-faint);white-space:nowrap;
}
.bar.grey{--c:var(--c-other);}
.bar.grey .bar-fill.at{background:linear-gradient(90deg,#C3C6C9 0%,#75797D 100%);}
:root[data-theme="dark"] .bar.grey .bar-fill.at{background:linear-gradient(90deg,#4A5057 0%,#8A9199 100%);}

/* ---------- Dashboard columns ---------- */
.dash{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:52px;margin-bottom:64px;}
.dash-col-head{margin-bottom:26px;}
.dash-col-head .nm{font-size:29px;font-weight:300;color:var(--c);line-height:1.1;
  display:inline-flex;align-items:center;gap:6px;cursor:pointer;}
.dash-col-head .nm .chev{width:20px;height:20px;stroke-width:2.2;opacity:.75;transition:transform .12s;}
.dash-col-head .nm:hover{text-decoration:underline;text-underline-offset:5px;}
.dash-col-head .nm:hover .chev{transform:translateX(3px);}

.subdash{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:52px;}
.subdash h3{font-size:27px;font-weight:300;color:var(--ink-faint);margin:0 0 26px;}
.subdash h3 .nm{display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:inherit;}
.subdash h3 .nm .chev{width:19px;height:19px;stroke-width:2.2;opacity:.7;transition:transform .12s;}
.subdash h3 .nm:hover{text-decoration:underline;text-underline-offset:5px;}
.subdash h3 .nm:hover .chev{transform:translateX(3px);}
.conf-note{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:12px 4px;font-size:13.5px;line-height:1.6;color:var(--ink-soft);margin-top:26px;}

/* ---------- Competency table (growth / strength) ---------- */
.ctable{width:100%;border-collapse:collapse;}
.ctable th{
  text-align:left;font-size:13px;font-weight:500;color:var(--ink);
  padding:0 34px 16px 0;vertical-align:bottom;line-height:1.4;
}
.ctable th:nth-child(1){width:340px;}
.ctable th:nth-child(2),.ctable th:nth-child(3){width:26%;}
.ctable td{padding:22px 0 26px;border-top:1px solid var(--rule);vertical-align:top;}
.ctable tr:last-child td{border-bottom:1px solid var(--rule);}
.ctable .col-bar{width:340px;padding-right:44px;}
.ctable .col-txt{width:auto;padding-right:34px;font-size:14px;line-height:1.5;}
.ctable .col-txt.off{color:var(--ink-faint);}
.ctable .col-bar .bar-link{margin-bottom:0;}

/* ---------- Checklist rows ---------- */
.clist{border-bottom:1px solid var(--rule);}
.crow{display:flex;gap:26px;align-items:flex-start;padding:22px 0;border-top:1px solid var(--rule);}
.crow .nm{flex:0 0 236px;font-size:13.5px;line-height:1.4;padding-top:1px;}
.crow .ds{flex:1;font-size:14px;line-height:1.5;color:var(--ink);}
.crow.plain .nm{flex:0 0 auto;}

.pip{width:22px;height:22px;border-radius:50%;flex-shrink:0;margin-top:-1px;
  border:2px solid var(--c,var(--ink-faint));background:transparent;}
.pip.on{background:var(--c,var(--ink-faint));}
.pip.half{background:linear-gradient(90deg,var(--c) 50%, transparent 50%);}

/* ---------- Beliefs / compat two-column ---------- */
.ttable{width:100%;border-collapse:collapse;}
.ttable th{text-align:left;font-size:13px;font-weight:500;padding:0 0 14px;color:var(--ink);}
.ttable td{padding:16px 0;border-top:1px solid var(--rule);font-size:14px;line-height:1.5;vertical-align:top;}
.ttable tr:last-child td{border-bottom:1px solid var(--rule);}
.ttable .lim{width:46%;padding-right:20px;}
.ttable .arrow{width:26px;color:var(--c-dna);font-size:15px;text-align:center;}
.ttable .sup{padding-left:20px;}
.ttable .lab{width:230px;color:var(--ink-soft);padding-right:24px;}

/* ---------- Motivation ---------- */
.mstyle-title{font-size:26px;font-weight:300;color:var(--c-will);margin:0 0 26px;}
.mbars{max-width:330px;margin:0 auto 46px;}
.mcols{display:grid;grid-template-columns:1fr 1px 1fr;gap:0 44px;}
.mcols .rule{background:var(--rule);}
.mcols h4{font-size:24px;font-weight:300;color:var(--c-will);margin:0 0 24px;}
.mrow{display:flex;align-items:center;gap:22px;padding:13px 0;font-size:14px;}
.tend{padding:13px 0;font-size:14px;line-height:1.5;}
.tend b{font-weight:500;}

/* ---------- Tiles ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:8px;}
.tile{
  border:1px solid var(--rule);border-radius:10px;padding:30px 28px;cursor:pointer;
  display:flex;flex-direction:column;gap:6px;min-height:150px;justify-content:center;
  transition:background .12s,border-color .12s;
}
.tile:hover{background:var(--hover);border-color:var(--ink-faint);}
.tile .k{font-size:12.5px;color:var(--ink-faint);}
.tile .v{font-size:25px;font-weight:300;line-height:1.15;}
.section-h{font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 20px;}

/* ---------- Curated list pages ---------- */
.fcard{border-top:1px solid var(--rule);padding:26px 0;display:grid;grid-template-columns:340px 1fr;gap:44px;align-items:start;}
.fcard:last-child{border-bottom:1px solid var(--rule);}
.fcard .why{font-size:14px;line-height:1.55;}
.fcard .why .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);display:block;margin-bottom:7px;}
.fcard .gname{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--c);margin-bottom:9px;}

.backlink{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-soft);margin-bottom:26px;cursor:pointer;}
.backlink:hover{color:var(--ink);}

@media (max-width:1180px){
  .dash,.subdash{grid-template-columns:1fr 1fr;}
}
@media (max-width:900px){
  #topLang{display:block;}
  .main{margin-left:0;}
  .sidebar{transform:translateX(-274px);}
  .sidebar.closed{transform:translateX(0);}
  .sheet{padding:32px 22px 80px;}
  .dash,.subdash,.tiles{grid-template-columns:1fr;gap:38px;}
  .phead{flex-direction:column;gap:18px;}
  .pscore{margin-left:0;text-align:left;padding-left:0;}
  .ctable .col-bar{width:auto;padding-right:0;display:block;}
  .ctable td{display:block;border-top:none;padding:0 0 14px;}
  .ctable tr{display:block;border-top:1px solid var(--rule);padding:20px 0 6px;}
  .ctable thead{display:none;}
  .ctable .col-txt::before{content:attr(data-lab);display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:5px;}
  .crow{flex-wrap:wrap;}
  .crow .nm{flex:0 0 calc(100% - 48px);}
  .crow .ds{flex:0 0 100%;padding-left:48px;}
  .mcols{grid-template-columns:1fr;}
  .mcols .rule{display:none;}
  .fcard{grid-template-columns:1fr;gap:18px;}
}
</style>
</head>

        {state:"on", name:{en:"Able to Ask Tough Questions",es:"Sabe Hacer Preguntas Difíciles"}, desc:{en:"Individuals who ask tough questions are able to challenge customers, ask appropriately provocative questions, and gain deep insight into their customer's problems.",es:"Quien hace preguntas difíciles puede desafiar al cliente, plantear preguntas provocadoras adecuadas y comprender a fondo sus problemas."}},
        {state:"on", name:{en:"Takes Nothing for Granted",es:"No Da Nada por Sentado"}, desc:{en:"Avoiding making assumptions helps individuals ask better questions and discover more about their prospect's needs.",es:"Evitar dar cosas por sentadas ayuda a hacer mejores preguntas y descubrir más sobre las necesidades del prospecto."}},
        {state:"on", name:{en:"Manages Appropriate Amount of Patience",es:"Gestiona Bien la Paciencia"}, desc:{en:"Individuals who exhibit an appropriate amount of patience walk the line between not accepting delays while also not coming across as pushy.",es:"Mostrar la paciencia adecuada implica no aceptar retrasos sin parecer insistente."}},
        {state:"on", name:{en:"Understands How Prospects Will Buy",es:"Entiende Cómo Comprará el Prospecto"}, desc:{en:"It is important to discover who will make the decision to buy, and also the process they'll use to decide whether to buy.",es:"Es importante descubrir quién tomará la decisión de compra y qué proceso seguirá para decidir."}},
        {state:"off", name:{en:"Develops Strong Relationships",es:"Desarrolla Relaciones Sólidas"}, desc:{en:"Individuals who are strong at developing relationships are better able to sell consultatively.",es:"Quien es fuerte construyendo relaciones vende mejor de forma consultiva."}},
        {state:"off", name:{en:"Presenting at Appropriate Times",es:"Presenta en el Momento Adecuado"}, desc:{en:"Individuals with good intuition for when to present and when to have a two-way conversation with customers avoid placing too much importance on educating prospects.",es:"Tener buena intuición sobre cuándo presentar y cuándo mantener una conversación bidireccional evita dar demasiada importancia a educar al prospecto."}},
        {state:"on", name:{en:"Healthy Skepticism",es:"Escepticismo Saludable"}, desc:{en:"Maintaining a healthy skepticism and not being overly trusting of prospects helps salespeople get more accurate answers to tough questions.",es:"Mantener un escepticismo saludable y no confiar en exceso ayuda a obtener respuestas más precisas a preguntas difíciles."}}
      ]}},
    {id:"sellingValue", name:{en:"Selling Value",es:"Venta de Valor"}, score:40, target:67,
      growth:{en:"talk about their service's value without personally being part of the value, leading to a buying decision based on price.",
              es:"hablan del valor de su servicio sin formar parte personalmente de ese valor, lo que lleva a una decisión de compra basada en el precio."},
      strength:{en:"position themself as a trusted advisor and provide the customer with crucial solutions unavailable elsewhere.",
                es:"se posicionan como asesores de confianza y ofrecen al cliente soluciones clave que no encontraría en ningún otro sitio."},
      drill:{type:"checklist", items:[
        {state:"on", name:{en:"Focused on Value over Price",es:"Centrado en el Valor, No en el Precio"}, desc:{en:"The tendency not to shop around for the best price helps individuals avoid being sympathetic to prospects who want to compare a price with competitors. In doing so, individuals are able to better keep the conversation on value as opposed to price.",es:"No buscar el mejor precio ayuda a no ser comprensivo con prospectos que quieren comparar precios con la competencia, manteniendo así la conversación centrada en el valor."}},
        {state:"off", name:{en:"Will Discuss Finances",es:"Habla de Finanzas con Naturalidad"}, desc:{en:"Individuals who are comfortable discussing finances are able to have in-depth conversations to determine exactly how much their prospect will spend and navigate challenging budget issues.",es:"Sentirse cómodo hablando de finanzas permite mantener conversaciones en profundidad sobre cuánto gastará el prospecto y gestionar temas de presupuesto complicados."}},
        {state:"off", name:{en:"High Threshold for Money",es:"Umbral Alto para el Dinero"}, desc:{en:"This Buy Cycle attribute helps an individual to challenge prospects and customers when they raise concerns about price.",es:"Este rasgo del ciclo de compra ayuda a rebatir al prospecto o cliente cuando plantea dudas sobre el precio."}},
        {state:"on", name:{en:"Attempts to Sell Value",es:"Intenta Vender por Valor"}, desc:{en:"The tendency to hold firm when a prospect asks for a lower price helps individuals keep the focus of conversations on value as opposed to price.",es:"Mantenerse firme cuando el prospecto pide un precio más bajo ayuda a centrar la conversación en el valor y no en el precio."}},
        {state:"off", name:{en:"Sales Process Supports Selling Value",es:"Su Proceso de Venta Favorece el Valor"}, desc:{en:"An effective sales process should consist of the important milestones that support identifying value opportunities for prospects.",es:"Un proceso de venta eficaz debe incluir los hitos importantes que ayudan a identificar oportunidades de valor para el prospecto."}},
        {state:"off", name:{en:"Learns Why Prospects Will Buy",es:"Descubre Por Qué Comprará el Prospecto"}, desc:{en:"Individuals should listen to customers to determine why they will make a purchase, which helps that individual keep the conversation on those reasons instead of price.",es:"Hay que escuchar al cliente para saber por qué comprará, lo que ayuda a centrar la conversación en esos motivos y no en el precio."}},
        {state:"on", name:{en:"Doesn't Need Approval",es:"No Necesita Aprobación"}, desc:{en:"Strength in the Doesn't Need Approval Competency helps individuals push back when a prospect is focused more on price than value.",es:"Tener fortaleza en \"No necesita aprobación\" ayuda a rebatir cuando el prospecto se centra más en el precio que en el valor."}},
        {state:"off", name:{en:"Asks Great Questions",es:"Hace Muy Buenas Preguntas"}, desc:{en:"Asking great questions allows individuals to uncover insights that help them find ways to sell on value over price.",es:"Hacer buenas preguntas permite descubrir información que ayuda a vender por valor y no por precio."}},
        {state:"off", name:{en:"Asks Enough Questions",es:"Hace Suficientes Preguntas"}, desc:{en:"The tendency to ask lots of questions will help individuals uncover opportunities to help prospects focus on the value of their solution as opposed to the price.",es:"Hacer muchas preguntas ayuda a descubrir oportunidades para que el prospecto se centre en el valor de la solución y no en el precio."}},
        {state:"on", name:{en:"Avoids Making Assumptions",es:"Evita Dar Cosas por Sentadas"}, desc:{en:"Individuals who do not tend to make assumptions are able to dig deeper into a prospect's needs and discover opportunities to articulate the value of their solution.",es:"No dar cosas por sentadas permite profundizar en las necesidades del prospecto y descubrir formas de articular el valor de la solución."}},
        {state:"on", name:{en:"Quickly Develops Rapport",es:"Genera Rapport Rápidamente"}, desc:{en:"Being able to quickly develop rapport with prospects helps individuals steer conversations with prospects away from price and keep the focus on value.",es:"Generar rapport rápidamente ayuda a alejar la conversación del precio y mantenerla centrada en el valor."}},
        {state:"off", name:{en:"Not Compelled to Quote",es:"No se Precipita con los Presupuestos"}, desc:{en:"Individuals who are careful to only create quotes or proposals when they know they are going to win the business are able to avoid inadvertently shifting the focus to price when it should be on value.",es:"Ser cuidadoso y solo preparar presupuestos o propuestas cuando se sabe que se va a ganar el negocio evita desviar el foco hacia el precio cuando debería estar en el valor."}}
      ]}},
    {id:"qualifying", name:{en:"Qualifying",es:"Cualificación"}, score:22, target:67,
      growth:{en:"tend to prematurely prepare a quote, proposal, or presentation.",
              es:"tienden a preparar un presupuesto, una propuesta o una presentación de forma prematura."},
      strength:{en:"ask about everything that could possibly derail an opportunity before determining that it is fully qualified.",
                es:"preguntan por todo lo que podría hacer descarrilar una oportunidad antes de darla por totalmente cualificada."},
      drill:{type:"checklist", items:[
        {state:"off", name:{en:"Meets with Decision Maker",es:"Se Reúne con Quien Decide"}, desc:{en:"Strength in the Reaching Decision-Makers Competency helps individuals get the information they need to fully qualify opportunities.",es:"Tener fortaleza en \"Llegar a quien decide\" ayuda a obtener la información necesaria para cualificar bien las oportunidades."}},
        {state:"off", name:{en:"Uncovers Actual Budget",es:"Descubre el Presupuesto Real"}, desc:{en:"Individuals who are successful at getting prospects to share how much money they can spend are better able to properly qualify opportunities.",es:"Conseguir que el prospecto comparta cuánto puede gastar ayuda a cualificar mejor las oportunidades."}},
        {state:"off", name:{en:"Will Discuss Finances",es:"Habla de Finanzas con Naturalidad"}, desc:{en:"Comfort talking about money with prospects is critical to determining whether an opportunity is qualified to move forward in the sales process.",es:"Sentirse cómodo hablando de dinero es clave para determinar si una oportunidad está cualificada para avanzar."}},
        {state:"on", name:{en:"Knows Decision-Making Process",es:"Conoce el Proceso de Decisión"}, desc:{en:"Individuals should be able to successfully get prospects to disclose the process they will use to decide whether to buy from them.",es:"Hay que conseguir que el prospecto revele el proceso que usará para decidir si compra."}},
        {state:"off", name:{en:"Can Influence the Decision-Making Process",es:"Puede Influir en el Proceso de Decisión"}, desc:{en:"Individuals should be able to effect changes to a prospect's decision-making process when it is overly complex, unfavorable, and impeding an opportunity.",es:"Hay que poder influir en el proceso de decisión del prospecto cuando es demasiado complejo, desfavorable y frena la oportunidad."}},
        {state:"off", name:{en:"Handles High-Ticket Pricing OK",es:"Gestiona Bien los Precios Elevados"}, desc:{en:"Individuals should be comfortable handling customers' objections to a solution costing a lot of money.",es:"Hay que sentirse cómodo gestionando objeciones sobre soluciones de precio elevado."}},
        {state:"on", name:{en:"Need to Be Liked Doesn't Get in the Way",es:"Necesitar Caer Bien No le Frena"}, desc:{en:"Strength in the Doesn't Need Approval Competency helps individuals hold their ground on fully qualifying opportunities before moving them forward in the sales process.",es:"Tener fortaleza en \"No necesita aprobación\" ayuda a mantenerse firme cualificando bien antes de avanzar."}},
        {state:"off", name:{en:"Able to Stay in the Moment",es:"Se Mantiene en el Momento"}, desc:{en:"Strength in the Stays in the Moment Competency helps individuals avoid letting their emotional connection to an opportunity cloud their ability to properly qualify it.",es:"Tener fortaleza en \"Mantenerse en el momento\" evita que la conexión emocional con una oportunidad nuble su cualificación adecuada."}},
        {state:"off", name:{en:"Self-Limiting Beliefs Won't be an Obstacle",es:"Sus Creencias No Serán un Obstáculo"}, desc:{en:"Supportive Beliefs help ensure that individuals are objectively qualifying opportunities.",es:"Tener creencias favorables ayuda a cualificar las oportunidades de forma objetiva."}},
        {state:"off", name:{en:"Knows Why They Would Buy",es:"Sabe Por Qué Comprarían"}, desc:{en:"Individuals should be able to uncover the truly compelling reasons why a prospect would buy from them.",es:"Hay que descubrir los motivos realmente convincentes por los que el prospecto compraría."}},
        {state:"on", name:{en:"Asks about Everything",es:"Pregunta por Todo"}, desc:{en:"The ability to avoid making assumptions and rely on factual information helps individuals objectively qualify opportunities.",es:"Evitar dar cosas por sentadas y basarse en información objetiva ayuda a cualificar de forma objetiva."}},
        {state:"on", name:{en:"Not Vulnerable to Competition",es:"No es Vulnerable a la Competencia"}, desc:{en:"When individuals don't tend to comparison shop in their personal life, they are more likely to push back when a prospect wants to comparison shop.",es:"Quien no suele comparar precios en su vida personal tiende a rebatir mejor cuando el prospecto quiere comparar."}}
      ]}}
);

    {id:"presentation", name:{en:"Presentation Approach",es:"Enfoque de Presentación"}, score:27, target:67,

              es:"se centran más en presentar el producto o la solución que en considerar el momento, los temas concretos o quién debería estar presente."},

      drill:{type:"checklist", items:[

        {state:"off", name:{en:"Able to Minimize Talking about Company Products or Solutions",es:"Limita Hablar de Producto o Empresa"}, desc:{en:"Individuals should spend more time asking questions than talking about their company and what they are selling. This keeps presentations interesting and tailored to the prospect.",es:"Conviene dedicar más tiempo a preguntar que a hablar de la empresa y el producto, manteniendo la presentación interesante y adaptada al prospecto."}},
        {state:"on", name:{en:"Not Compelled to Present",es:"No se Siente Obligado a Presentar"}, desc:{en:"Individuals should have a practical view on the importance of presenting, allowing them to avoid presenting when it is not required.",es:"Conviene tener una visión práctica de la presentación, evitándola cuando no es necesaria."}},

        {state:"on", name:{en:"Does Not Believe Presenting Equates to Controlling the Sales Process",es:"No Cree que Presentar Sea Controlar el Proceso"}, desc:{en:"Individuals shouldn't need to be presenting to feel in control of the selling process.",es:"No hace falta estar presentando para sentir que se controla el proceso de venta."}},

        {state:"off", name:{en:"Not Compelled to Propose or Quote",es:"No se Precipita con Propuestas o Presupuestos"}, desc:{en:"Individuals should have a healthy outlook on when it is acceptable to create proposals or quotes and present at an appropriate time in the sales process.",es:"Conviene tener una visión sana sobre cuándo es aceptable elaborar propuestas o presupuestos."}},
        {state:"off", name:{en:"Asks Enough Questions",es:"Hace Suficientes Preguntas"}, desc:{en:"Individuals should understand the importance of not dominating the conversation during sales calls. While presenting solutions, this same attribute can help individuals find opportunities to learn more about their customer's needs.",es:"Es importante no dominar la conversación en las llamadas de venta; esto ayuda a descubrir más sobre las necesidades del cliente incluso al presentar."}},
        {state:"on", name:{en:"Takes Nothing for Granted",es:"No Da Nada por Sentado"}, desc:{en:"Individuals should rely on factual information as opposed to assumptions or hunches, which helps individuals tailor their presentations to each prospect's needs.",es:"Conviene basarse en información objetiva y no en suposiciones, adaptando la presentación a las necesidades de cada prospecto."}}
      ]}},
    {id:"closing", name:{en:"Closing",es:"Cierre"}, score:80, target:67,
      growth:{en:"tend to accept stalling, and work to close the business through their follow-up efforts.",
              es:"tienden a aceptar las largas y tratan de cerrar el negocio a base de seguimiento."},
      strength:{en:"get a verbal agreement in advance of the expected closing call or meeting, and be certain of getting a decision.",
                es:"obtienen un acuerdo verbal antes de la llamada o reunión de cierre prevista, asegurándose de conseguir una decisión."},
      drill:{type:"checklist", items:[
        {state:"off", name:{en:"Gets Prospect to Agree to Make a Decision",es:"Consigue que el Prospecto Acuerde Decidir"}, desc:{en:"When an individual is able to get their prospects to agree when decision-making will take place, it allows them to shorten their sales cycle and ensures presentations and proposals are accompanied by a decision.",es:"Conseguir que el prospecto acuerde cuándo se tomará la decisión acorta el ciclo de venta y asegura que las propuestas vayan acompañadas de una decisión."}},
        {state:"on", name:{en:"Not Likely to Take \"Think it Overs\"",es:"No Acepta Fácilmente las Largas"}, desc:{en:"Individuals who don't tend to mull over purchases are able to push back when prospects ask for time to think over their purchase.",es:"Quien no suele darle vueltas a sus propias compras puede rebatir mejor cuando el prospecto pide tiempo para pensarlo."}},
        {state:"on", name:{en:"Unlikely to be Derailed by Put-Offs",es:"No se Deja Descarrilar por Excusas"}, desc:{en:"Individuals who are able to successfully avoid prospect's stalls can focus instead on tangible next steps and decisions.",es:"Evitar con éxito las largas del prospecto permite centrarse en pasos concretos y decisiones."}},
        {state:"on", name:{en:"Manages Appropriate Amount of Patience",es:"Gestiona Bien la Paciencia"}, desc:{en:"An appropriate amount of patience at closing time means not being too impatient to appear pushy and not being too patient to accept delays.",es:"La paciencia adecuada en el cierre implica no parecer insistente ni aceptar demasiados retrasos."}},
        {state:"on", name:{en:"Closing Urgency",es:"Urgencia de Cierre"}, desc:{en:"Individuals should appropriately push back when their prospect asks them to follow up later about a final purchasing decision.",es:"Conviene rebatir adecuadamente cuando el prospecto pide posponer la decisión final."}},
        {state:"on", name:{en:"Sales Assertiveness",es:"Asertividad en la Venta"}, desc:{en:"Individuals should exhibit an appropriate amount of assertiveness with customers, being neither too timid nor too overconfident.",es:"Conviene mostrar la asertividad adecuada con el cliente, sin ser ni tímido ni excesivamente confiado."}},
        {state:"off", name:{en:"Won't Make Inappropriate Quotes",es:"No Genera Presupuestos Prematuros"}, desc:{en:"A good perspective on quotes and proposals means only generating them when the business is likely to be won.",es:"Una buena perspectiva sobre presupuestos y propuestas implica generarlos solo cuando es probable ganar el negocio."}},
        {state:"on", name:{en:"Problem Solver",es:"Resuelve Problemas"}, desc:{en:"Successful negotiation involves thinking of solutions, as opposed to worrying about problems or getting consumed by them.",es:"La negociación exitosa implica pensar en soluciones en lugar de preocuparse por los problemas."}},
        {state:"off", name:{en:"Reaching Decision-Makers",es:"Llega a Quien Decide"}, desc:{en:"An individual who is strong in the Reaching Decision Makers Competency will generally talk to the right people to be able to close opportunities.",es:"Ser fuerte en \"Llegar a quien decide\" implica hablar con las personas adecuadas para poder cerrar oportunidades."}},
        {state:"on", name:{en:"Doesn't Need Approval",es:"No Necesita Aprobación"}, desc:{en:"Strength in the Doesn't Need Approval Competency helps individuals push deals over the finish line.",es:"Tener fortaleza en \"No necesita aprobación\" ayuda a llevar los acuerdos hasta el final."}},
        {state:"off", name:{en:"Stays in the Moment",es:"Se Mantiene en el Momento"}, desc:{en:"Strength in the Stays in the Moment Competency helps individuals stay objective at closing and avoid emotion clouding their judgement.",es:"Tener fortaleza en \"Mantenerse en el momento\" ayuda a ser objetivo en el cierre, sin que la emoción nuble el juicio."}},
        {state:"on", name:{en:"Seeks Win/Win",es:"Busca un Resultado Beneficioso para Ambos"}, desc:{en:"Individuals who are strong negotiators tend to find \"win/win\" outcomes, where both they and their customer get something they want.",es:"Los buenos negociadores suelen encontrar resultados en los que ambas partes ganan algo."}},
        {state:"off", name:{en:"Will Find a Way to Close",es:"Encuentra la Forma de Cerrar"}, desc:{en:"Individuals strong at closing are able to consistently get their prospects to agree to make a decision before trying to close the opportunity.",es:"Quien es fuerte cerrando consigue que el prospecto acuerde tomar una decisión antes de intentar el cierre."}}
      ]}},

function t(k){ return (UI[STATE.lang]&&UI[STATE.lang][k]) || UI.en[k] || k; }
function tr(o){ if(!o) return ""; return o[STATE.lang] || o.en || ""; }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }

function findFinding(gk,id){
  var g=GROUPS[gk]; if(!g) return null;
  for(var i=0;i<g.findings.length;i++) if(g.findings[i].id===id) return g.findings[i];
  return null;
}
function cvar(gk){ return "var(--c-"+gk+")"; }
function atTarget(f){ return f.score >= f.target; }

/* ============ COMPONENTS ============ */

/* pill bar — width = min-cap + remaining track scaled by the score, exactly as OMG draws it */
function bar(score,target,gk,opts){
  opts=opts||{};
  var pos = function(v){ return "calc(var(--bar-min) + (100% - var(--bar-min)) * "+(Math.max(0,Math.min(100,v))/100)+")"; };
  var at = score>=target;
  var cls = "bar" + (gk==="other"||gk==="grey" ? " grey" : "");
  var style = (gk && gk!=="other" && gk!=="grey") ? ' style="--c:'+cvar(gk)+'"' : "";
  var label = opts.label ? '<div class="bar-label">'+opts.label+'</div>' : "";
  var tick = (target||target===0)
    ? '<div class="bar-tick" style="left:'+pos(target)+'">'+esc(t("target"))+' '+target+'</div>' : "";
  var inner = '<div class="'+cls+'"'+style+'>'+label+
    '<div class="bar-track">'+
      '<div class="bar-fill'+(at?" at":"")+'" style="width:'+pos(score)+'"><span>'+score+'</span></div>'+
      tick+
    '</div></div>';
  if(opts.href){
    var wrapCls = "bar-link" + (gk==="other"||gk==="grey" ? " grey" : "");
    return '<div class="'+wrapCls+'"'+style+' data-go="'+esc(opts.href)+'" role="link" tabindex="0">'+inner+'</div>';
  }
  return inner;
}

var CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';

/* one label builder for every place a finding is listed: name, plus a chevron
   and a click target when that finding has its own findings page */
function findingBar(gk,f,extraOpts){
  var o = extraOpts || {};
  var href = f.drill ? "#f-"+gk+"-"+f.id : null;
  o.label = '<div class="bar-label'+(href?" drill":"")+'">'+esc(tr(f.name))+(href?CHEV:"")+'</div>';
  if(href) o.href = href;
  return bar(f.score, f.target, gk, o);
}

function pip(state,gk){
  var c = gk ? ' style="--c:'+cvar(gk)+'"' : "";
  return '<div class="pip '+esc(state||"off")+'"'+c+'></div>';
}

function scoreBlock(score,target,gk){
  var col = score>=target ? cvar(gk) : "var(--ink-faint)";
  return '<div class="pscore" style="--sc:'+col+'"><div class="n">'+score+'</div>'+
         '<div class="t">'+esc(t("target"))+' '+target+'</div></div>';
}

function pageHeadStacked(title,intro,scoreHTML){
  return '<div class="phead stacked"><div class="row">'+
    '<h1 class="ptitle">'+esc(title)+'</h1>'+(scoreHTML||"")+'</div>'+
    (intro?'<div class="pintro">'+intro+'</div>':'')+'</div>';
}

function pageHead(title,intro,scoreHTML){
  return '<div class="phead"><div class="phead-l"><h1 class="ptitle">'+esc(title)+'</h1></div>'+
    (intro?'<div class="pintro">'+intro+'</div>':'<div class="pintro"></div>')+
    (scoreHTML||"")+'</div>';
}

function backLink(href,label){
  return '<div class="backlink" data-go="'+esc(href)+'">'+
    '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>'+
    esc(label)+'</div>';
}

/* ============ PAGES ============ */

function renderHome(){
  var cols = "";
  for(var i=0;i<3;i++){
    var gk=ORDER[i][0], g=ORDER[i][1];
    var bars = g.findings.map(function(f){ return findingBar(gk,f); }).join("");
    cols += '<div style="--c:'+cvar(gk)+'">'+
      '<div class="dash-col-head"><a class="nm" data-go="#g-'+gk+'">'+esc(tr(g.name))+CHEV+'</a></div>'+
      bars+'</div>';
  }

  var devBars = [DEV.coachable, DEV.figureItOut].map(function(d){
    return bar(d.score,d.target,"grey",{label:'<div class="bar-label">'+esc(tr(d.name))+'</div>'});
  }).join("");

  var otherBars = GROUP_OTHER.findings.map(function(f){ return findingBar("other",f); }).join("");

  var confBlock = bar(CONFIDENCE.score,CONFIDENCE.target,"grey",
      {label:'<div class="bar-label">'+esc(tr(CONFIDENCE.label))+'</div>'})+
    '<div class="conf-note">'+tr(CONFIDENCE.note)+'</div>';

  var sub = '<div class="subdash">'+
    '<div><h3>'+esc(t("dash.development"))+'</h3>'+devBars+'</div>'+
    '<div><h3><a class="nm" data-go="#g-other">'+esc(t("dash.other"))+CHEV+'</a></h3>'+otherBars+'</div>'+
    '<div><h3>'+esc(t("dash.confidence"))+'</h3>'+confBlock+'</div>'+
  '</div>';

  var tiles = '<div style="margin-top:72px"><div class="section-h">'+esc(t("nav.lushin"))+'</div>'+
    '<div class="tiles">'+
      '<div class="tile" data-go="#strengths"><div class="k">'+esc(CANDIDATE.name)+'</div><div class="v">'+esc(t("strengths.title"))+'</div></div>'+
      '<div class="tile" data-go="#focus"><div class="k">'+esc(CANDIDATE.name)+'</div><div class="v">'+esc(t("focus.title"))+'</div></div>'+
    '</div></div>';

  return '<div class="sheet"><div class="dash">'+cols+'</div>'+sub+tiles+'</div>';
}

function renderGroup(gk){
  var g=GROUPS[gk];
  var rows = g.findings.map(function(f){
    var at = atTarget(f);
    return '<tr><td class="col-bar">'+findingBar(gk,f)+'</td>'+
      '<td class="col-txt'+(at?" off":"")+'" data-lab="'+esc(t("growthLabel"))+'">'+esc(tr(f.growth))+'</td>'+
      '<td class="col-txt'+(at?"":" off")+'" data-lab="'+esc(t("strengthLabel"))+'">'+esc(tr(f.strength))+'</td></tr>';
  }).join("");

  return '<div class="sheet">'+
    pageHead(tr(g.name), esc(tr(g.intro)))+
    '<table class="ctable"><thead><tr><th></th>'+
      '<th>'+esc(t("growthLabel"))+'</th><th>'+esc(t("strengthLabel"))+'</th></tr></thead>'+
    '<tbody>'+rows+'</tbody></table></div>';
}

function renderFinding(gk,id){
  var g=GROUPS[gk], f=findFinding(gk,id);
  if(!f) return renderGroup(gk);
  var head = backLink("#g-"+gk, tr(g.name)) +
    pageHeadStacked(tr(f.name), esc(DEFS[gk+"."+f.id] ? tr(DEFS[gk+"."+f.id]) : ""), scoreBlock(f.score,f.target,gk));
  var d=f.drill, body="";

  if(!d){
    body = '<div class="clist"><div class="crow"><div class="nm">'+esc(t("growthLabel"))+'</div>'+
      '<div class="ds">'+esc(tr(f.growth))+'</div></div>'+
      '<div class="crow"><div class="nm">'+esc(t("strengthLabel"))+'</div>'+
      '<div class="ds">'+esc(tr(f.strength))+'</div></div></div>';
  } else if(d.type==="checklist"){
    body = '<div class="clist">'+d.items.map(function(it){
      var cls = it.desc ? "crow" : "crow plain";
      return '<div class="'+cls+'">'+pip(it.state,gk)+
        '<div class="nm">'+esc(tr(it.name))+'</div>'+
        (it.desc?'<div class="ds">'+esc(tr(it.desc))+'</div>':'')+'</div>';
    }).join("")+'</div>';
  } else if(d.type==="beliefs"){
    body = '<table class="ttable"><thead><tr><th class="lim">'+esc(t("beliefs.lim"))+'</th><th></th>'+
      '<th class="sup">'+esc(t("beliefs.sup"))+'</th></tr></thead><tbody>'+
      d.pairs.map(function(p){
        return '<tr><td class="lim">'+esc(tr(p.lim))+'</td><td class="arrow">»</td>'+
          '<td class="sup">'+esc(tr(p.sup))+'</td></tr>';
      }).join("")+'</tbody></table>';
  } else if(d.type==="compat"){
    body = '<table class="ttable"><tbody>'+d.pairs.map(function(p){
      return '<tr><td class="lab">'+esc(tr(p.label))+'</td><td>'+
        p.values.map(function(v){return esc(tr(v));}).join("<br>")+'</td></tr>';
    }).join("")+'</tbody></table>';
  } else if(d.type==="motivation"){
    var s=d.style;
    var mb = [["Extrinsic","Extrínseco",s.extrinsic],["Intrinsic","Intrínseco",s.intrinsic],["Altruistic","Altruista",s.altruistic]];
    var top = Math.max(s.extrinsic,s.intrinsic,s.altruistic);
    var mbars = mb.map(function(r){
      var label = STATE.lang==="es" ? r[1] : r[0];
      return bar(r[2], r[2]===top?0:101, "will", {label:'<div class="bar-label">'+esc(label)+'</div>'})
        .replace(/<div class="bar-tick"[\s\S]*?<\/div>/,"");
    }).join("");
    body = '<h2 class="mstyle-title">'+esc(t("motivation.styleTitle"))+': '+esc(tr(s.dominant))+'</h2>'+
      '<div class="mbars">'+mbars+'</div>'+
      '<div class="mcols"><div><h4>'+esc(t("motivation.attributes"))+'</h4>'+
        d.attributes.map(function(a){
          return '<div class="mrow">'+pip(a.state,"will")+'<span>'+esc(tr(a.name))+'</span></div>';
        }).join("")+
      '</div><div class="rule"></div><div><h4>'+esc(t("motivation.tendencies"))+'</h4>'+
        d.tendencies.map(function(x){return '<div class="tend">'+tr(x)+'</div>';}).join("")+
      '</div></div>';
  }
  return '<div class="sheet">'+head+body+'</div>';
}

function renderCurated(kind){
  var list = kind==="strengths" ? STRENGTHS : FOCUS;
  var cards = list.map(function(item){
    var gk=item.ref[0], f=findFinding(gk,item.ref[1]), g=GROUPS[gk];
    var why = item.reason
      ? '<div class="why">'+esc(tr(item.reason))+'</div>'
      : '<div class="why">'+esc(tr(f.strength))+'</div>';
    return '<div class="fcard" style="--c:'+cvar(gk)+'">'+
      '<div><div class="gname">'+esc(tr(g.name))+'</div>'+findingBar(gk,f)+'</div>'+
      why+'</div>';
  }).join("");
  return '<div class="sheet">'+
    pageHead(t(kind+".title"), esc(t(kind+".intro")))+cards+'</div>';
}

  function item(href,label,color,extra){

    return '<div class="sb-item'+(on?" active":"")+'" data-go="'+href+'"'+
      (color?' style="--c:'+color+'"':'')+'><div class="dot"></div><span>'+esc(label)+'</span></div>'+(extra||"");
  }

  out += item("#home", t("nav.dashboard"), "var(--ink-faint)");

  out += '<div class="sb-group-label">'+esc(t("nav.lushin"))+'</div>';

  out += item("#focus", t("focus.title"), "var(--ink-faint)");

  out += '<div class="sb-group-label">'+esc(t("nav.competencies"))+'</div>';

        if(!f.drill) return "";
        var href="#f-"+gk+"-"+f.id;
        return '<div class="sb-subitem'+(route===href?" active":"")+'" data-go="'+href+'">'+esc(tr(f.name))+'</div>';
      }).join("")+'</div>';
    var navDot = gk==="other" ? "var(--ink-faint)" : cvar(gk);
    out += item("#g-"+gk, tr(g.name), navDot, subs);
  }
  out += '</div>';

  out += '<div class="sb-foot">'+
    langToggle("")+
    '<div class="sb-foot-row"><span class="sb-foot-label">'+esc(t("theme"))+'</span>'+
      '<button class="icon-btn" id="themeBtn" aria-label="'+esc(t("theme"))+'">'+

        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'

function langToggle(extraCls){
  var on = function(l){ return STATE.lang===l ? " on":""; };
  return '<div class="seg lang'+(extraCls?" "+extraCls:"")+'" role="group" aria-label="'+esc(t("lang.label"))+'">'+
    '<button data-lang="en" class="'+on("en")+'">'+esc(UI.en["lang.en"])+'</button>'+
    '<button data-lang="es" class="'+on("es")+'">'+esc(UI.en["lang.es"])+'</button></div>';
}

/* ============ ROUTER ============ */
function crumbFor(route){
  if(route.indexOf("#f-")===0){
    var p=route.slice(3).split("-"), gk=p[0], id=p.slice(1).join("-");
    var g=GROUPS[gk], f=findFinding(gk,id);
    return g ? '<b>'+esc(tr(g.name))+'</b>' + (f?' &nbsp;/&nbsp; '+esc(tr(f.name)):"") : "";
  }
  if(route.indexOf("#g-")===0){ var gg=GROUPS[route.slice(3)]; return gg?'<b>'+esc(tr(gg.name))+'</b>':""; }
  if(route==="#strengths") return '<b>'+esc(t("strengths.title"))+'</b>';
  if(route==="#focus") return '<b>'+esc(t("focus.title"))+'</b>';
  return '<b>'+esc(t("nav.dashboard"))+'</b>';
}

function view(route){
  if(route.indexOf("#f-")===0){
    var p=route.slice(3).split("-");
    return renderFinding(p[0], p.slice(1).join("-"));
  }
  if(route.indexOf("#g-")===0) return renderGroup(route.slice(3));
  if(route==="#strengths") return renderCurated("strengths");
  if(route==="#focus") return renderCurated("focus");
  return renderHome();
}

function render(){
  var route = location.hash || "#home";
  if(!/^#(home|strengths|focus|g-|f-)/.test(route)) route="#home";
  document.documentElement.setAttribute("data-theme", STATE.theme);
  document.documentElement.setAttribute("lang", STATE.lang);
  document.getElementById("sidebar").innerHTML = sidebar(route);
  document.getElementById("crumb").innerHTML = crumbFor(route);
  document.getElementById("topLang").innerHTML = langToggle("compact");
  var main = document.getElementById("view");
  main.className = route==="#home" ? "flushtop" : "";
  main.innerHTML = view(route);
  document.getElementById("sidebar").classList.toggle("closed", !STATE.sidebar);
  document.getElementById("main").classList.toggle("wide", !STATE.sidebar);
  document.title = CANDIDATE.name + " — " + t("nav.title");
  window.scrollTo(0,0);
}

document.addEventListener("click", function(e){
  var go = e.target.closest("[data-go]");
  if(go){ location.hash = go.getAttribute("data-go"); return; }
  var lang = e.target.closest("[data-lang]");
  if(lang){ STATE.lang = lang.getAttribute("data-lang"); save(); render(); return; }
  if(e.target.closest("#themeBtn")){ STATE.theme = STATE.theme==="dark"?"light":"dark"; save(); render(); return; }
  if(e.target.closest("#burger")){ STATE.sidebar = !STATE.sidebar; save(); render(); return; }
});
document.addEventListener("keydown", function(e){
  if(e.key!=="Enter" && e.key!==" ") return;
  var go = e.target && e.target.closest && e.target.closest("[data-go][tabindex]");
  if(go){ e.preventDefault(); location.hash = go.getAttribute("data-go"); }
});
window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
